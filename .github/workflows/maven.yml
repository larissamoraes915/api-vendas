name: Build Fornecedores Service

on:
  push:
    branches: [ "main", "master", "atividade-larissa" ]
  pull_request:
    branches: [ "main", "master", "atividade-larissa" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositorio
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compilar com Maven
      run: |
        if [ -d "fornecedores-service" ]; then
          cd fornecedores-service
          mvn clean package -DskipTests
        else
          echo "Compilando pom.xml da raiz..."
          mvn clean package -DskipTests
        fi
