services:
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - microservices-net

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - SERVER_PORT=8888
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JAVA_TOOL_OPTIONS=-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - microservices-net

  produtos-service:
    build:
      context: ./produtos-service
      dockerfile: Dockerfile
    container_name: produtos-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888/
      - JAVA_TOOL_OPTIONS=-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/ -Dspring.cloud.config.uri=http://config-server:8888
    depends_on:
      - eureka-server
      - config-server
    networks:
      - microservices-net

  vendas-service:
    build:
      context: ./vendas-service
      dockerfile: Dockerfile
    container_name: vendas-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888/
      - JAVA_TOOL_OPTIONS=-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/ -Dspring.cloud.config.uri=http://config-server:8888
    depends_on:
      - eureka-server
      - config-server
    networks:
      - microservices-net

  clientes-service:
    build:
      context: ./clientes-service
      dockerfile: Dockerfile
    container_name: clientes-service
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888/
      - JAVA_TOOL_OPTIONS=-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/ -Dspring.cloud.config.uri=http://config-server:8888
    depends_on:
      - eureka-server
      - config-server
    networks:
      - microservices-net

  fornecedores-service:
    build:
      context: ./fornecedores-service
      dockerfile: Dockerfile
    container_name: fornecedores-service
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JAVA_TOOL_OPTIONS=-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/ -Dspring.cloud.config.uri=http://config-server:8888
    depends_on:
      - eureka-server
      - config-server
    networks:
      - microservices-net

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CLOUD_GATEWAY_ROUTES_0_ID=fornecedores-service
      - SPRING_CLOUD_GATEWAY_ROUTES_0_URI=http://fornecedores-service:8084
      - SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0=Path=/fornecedores/**
      - SPRING_CLOUD_GATEWAY_ROUTES_1_ID=fornecedores-prefix
      - SPRING_CLOUD_GATEWAY_ROUTES_1_URI=http://fornecedores-service:8084
      - SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0=Path=/fornecedores-service/**
      - SPRING_CLOUD_GATEWAY_ROUTES_1_FILTERS_0=StripPrefix=1
    depends_on:
      - eureka-server
      - fornecedores-service
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge